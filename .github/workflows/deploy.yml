name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Least-privilege token + no overlapping deploys.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Type-checks (tsc -b) and builds with the GitHub Pages base path
      # /campusguard-ai/ baked in, so assets and router basename match the
      # project-site URL. No secrets are passed — only optional public
      # repository *variables* (values are inlined into the client bundle,
      # so they must never be secrets).
      - name: Build for GitHub Pages
        run: bun run build:pages
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_VLY_APP_ID: ${{ vars.VITE_VLY_APP_ID }}
          VITE_VLY_MONITORING_URL: ${{ vars.VITE_VLY_MONITORING_URL }}

      - name: Warn if Convex backend URL is missing
        if: ${{ vars.VITE_CONVEX_URL == '' }}
        run: |
          echo "::warning::Repository variable VITE_CONVEX_URL is not set. The site will build, but it cannot reach its Convex backend until you add it in Settings -> Secrets and variables -> Actions -> Variables."

      # GitHub Pages has no server-side rewrite rule: any deep link such as
      # /campusguard-ai/app/complaints/abc123 would 404. Serving index.html
      # as 404.html lets the SPA boot on those URLs; React Router then
      # matches the path under the /campusguard-ai basename.
      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      # Harmless with the Actions deployment flow, and keeps any future
      # Jekyll-style processing from dropping _-prefixed files.
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
